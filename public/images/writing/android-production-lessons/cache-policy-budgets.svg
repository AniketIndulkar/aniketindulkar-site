<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="cache-title cache-desc">
  <style>
  .node { fill: #0b111b; stroke: #273342; stroke-width: 1.5; }
  .node-accent { fill: #10202a; stroke: #6ed9ee; stroke-width: 1.5; }
  .node-secondary { fill: #151827; stroke: #9187ff; stroke-width: 1.5; }
  .node-warning { fill: #1b1410; stroke: #d79468; stroke-width: 1.5; }
  .label { fill: #f2f2ec; font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
  .label-left { fill: #f2f2ec; font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: start; }
  .label-small { fill: #a9b3bf; font: 500 10.5px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
  .connector { fill: none; stroke: #8f9aa7; stroke-width: 1.3; }
</style>
  <title id="cache-title">One cache policy, seven budgets</title>
  <desc id="cache-desc">A single cache policy decision fans out into seven separate budgets: freshness and time to live, device storage, user network data, backend load, security sensitivity, offline requirement, and migration behaviour on rollout.</desc>

  <defs>
    <marker id="k-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f9aa7" />
    </marker>
  </defs>

  <rect class="node-accent" x="8" y="104" width="100" height="52" rx="6" />
  <text class="label" x="58" y="126">Cache policy</text>
  <text class="label-small" x="58" y="141">one decision</text>

  <rect class="node-secondary" x="166" y="6" width="186" height="26" rx="5" />
  <text class="label-left" x="178" y="23">Freshness / TTL</text>

  <rect class="node-secondary" x="166" y="40" width="186" height="26" rx="5" />
  <text class="label-left" x="178" y="57">Device storage budget</text>

  <rect class="node-secondary" x="166" y="74" width="186" height="26" rx="5" />
  <text class="label-left" x="178" y="91">User network data</text>

  <rect class="node-secondary" x="166" y="108" width="186" height="26" rx="5" />
  <text class="label-left" x="178" y="125">Backend load</text>

  <rect class="node-warning" x="166" y="142" width="186" height="26" rx="5" />
  <text class="label-left" x="178" y="159">Security sensitivity</text>

  <rect class="node-secondary" x="166" y="176" width="186" height="26" rx="5" />
  <text class="label-left" x="178" y="193">Offline requirement</text>

  <rect class="node-warning" x="166" y="210" width="186" height="26" rx="5" />
  <text class="label-left" x="178" y="227">Migration behaviour</text>

  <path class="connector" d="M 108 130 C 138 130, 138 19, 164 19" marker-end="url(#k-arrow)" />
  <path class="connector" d="M 108 130 C 138 130, 138 53, 164 53" marker-end="url(#k-arrow)" />
  <path class="connector" d="M 108 130 C 138 130, 138 87, 164 87" marker-end="url(#k-arrow)" />
  <path class="connector" d="M 108 130 L 164 121" marker-end="url(#k-arrow)" />
  <path class="connector" d="M 108 130 C 138 130, 138 155, 164 155" marker-end="url(#k-arrow)" />
  <path class="connector" d="M 108 130 C 138 130, 138 189, 164 189" marker-end="url(#k-arrow)" />
  <path class="connector" d="M 108 130 C 138 130, 138 223, 164 223" marker-end="url(#k-arrow)" />
</svg>
