<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="d8-title d8-desc">
  <style>
  .node { fill: #0b111b; stroke: #273342; stroke-width: 1.5; }
  .node-accent { fill: #10202a; stroke: #6ed9ee; stroke-width: 1.5; }
  .node-secondary { fill: #151827; stroke: #9187ff; stroke-width: 1.5; }
  .node-success { fill: #0f1d18; stroke: #79d49b; stroke-width: 1.5; }
  .node-warning { fill: #1b1410; stroke: #d79468; stroke-width: 1.5; }
  .label { fill: #f2f2ec; font: 600 13.5px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
  .label-small { fill: #a9b3bf; font: 500 12.5px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
  .label-left { fill: #f2f2ec; font: 600 13.5px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: start; }
  .annotation { fill: #a9b3bf; font: 500 12.5px Inter, ui-sans-serif, system-ui, sans-serif; }
  .connector { fill: none; stroke: #8f9aa7; stroke-width: 1.5; }
  .connector-accent { fill: none; stroke: #6ed9ee; stroke-width: 2; }
  .connector-secondary { fill: none; stroke: #9187ff; stroke-width: 2; }
  .guide { fill: none; stroke: #273342; stroke-width: 1; stroke-dasharray: 4 4; }
</style>
  <title id="d8-title">Graceful degradation under load</title>
        <desc id="d8-desc">As load rises, the system deliberately removes optional expensive stages: first reranking, then ranking, and finally serves cached results or rejects requests before queues become unbounded.</desc>
        <text class="annotation" x="20" y="24">Load and queue pressure increase ↓</text>
        <rect class="node-success" x="20" y="38" width="320" height="46" rx="7" />
        <text class="label-left" x="34" y="58">Normal</text>
        <text class="label-small" x="208" y="58">retrieval + ranker + reranker</text>
        <text class="label-small" x="208" y="73">best relevance</text>
        <rect class="node-accent" x="20" y="98" width="320" height="46" rx="7" />
        <text class="label-left" x="34" y="118">Moderate</text>
        <text class="label-small" x="208" y="118">retrieval + ranker</text>
        <text class="label-small" x="208" y="133">skip optional reranking</text>
        <rect class="node-secondary" x="20" y="158" width="320" height="46" rx="7" />
        <text class="label-left" x="34" y="178">Heavy</text>
        <text class="label-small" x="208" y="178">retrieval only</text>
        <text class="label-small" x="208" y="193">reduce candidate exploration</text>
        <rect class="node-warning" x="20" y="218" width="320" height="46" rx="7" />
        <text class="label-left" x="34" y="238">Extreme</text>
        <text class="label-small" x="208" y="238">cached / stale results</text>
        <text class="label-small" x="208" y="253">or controlled rejection</text>
        <text class="annotation" x="20" y="284">Bounded queues preserve predictable failure modes.</text>
</svg>
